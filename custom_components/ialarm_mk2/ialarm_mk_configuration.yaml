template:
  - sensor:
      - name: "iAlarm MK Stato"
        state: "{{ states('alarm_control_panel.ialarm_mk') }}"
        icon: >-
          {% set st = states('alarm_control_panel.ialarm_mk') %}
          {% if st == 'disarmed' %}
            mdi:home-lock-open
          {% elif st == 'armed_away' %}
            mdi:home-lock
          {% elif st == 'armed_home' %}
            mdi:home-map-marker
          {% elif st == 'armed_custom_bypass' %}
            mdi:home-search
          {% elif st == 'triggered' %}
            mdi:bell-alert
          {% else %}
            mdi:shield
          {% endif %}

ios:
  actions:
    - name: attiva_allarme
      label:
        text: "Attiva Allarme"
      icon:
        icon: home_export_outline
        color: "#ff0000"
      show_in_carplay: true
      show_in_watch: true
    - name: disattiva_allarme
      label:
        text: "Disattiva Allarme"
      icon:
        icon: home_import_outline
        color: "#00ff00"
      show_in_carplay: true
      show_in_watch: true
    - name: attiva_incasa_allarme
      label:
        text: "Attiva Allarme in casa"
      icon:
        icon: home_account
        color: "#ffa500"
      show_in_carplay: true
      show_in_watch: true
    - name: attiva_parziale_allarme
      label:
        text: "Attiva Allarme parziale"
      icon:
        icon: home_account
        color: "#ffa500"
      show_in_carplay: true
      show_in_watch: true